<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c3937">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Finnish in Context</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./practice.css">
    <script type="module" src="./practice.mjs"></script>
  </head>
  <body>
    <main class="layout">
      <header class="intro">
        <a href="/">Acme Dashboard</a>
        <h1>Finnish in<br> Context</h1>
        <p>Learn how everyday Finnish swearing changes form in a sentence.</p>
        <p id="offline" role="status"></p>
      </header>
      <section class="card" aria-labelledby="exercise-title">
        <h2 id="exercise-title" tabindex="-1">Complete the dialogue</h2>
        <label id="progress-label" for="progress">Question 1</label>
        <progress id="progress" value="1" max="1"></progress>
        <form id="exercise">
          <p class="dialogue" id="prompt" lang="fi"></p>
          <p class="dialogue" id="sentence" lang="fi"></p>
          <p id="context" class="context"></p>
          <fieldset>
            <legend>Choose a form</legend>
            <div id="options"></div>
          </fieldset>
          <button id="check" type="submit">Check answer</button>
        </form>
        <p id="feedback" role="status"></p>
        <button id="next" type="button" hidden>Next question</button>
        <button id="restart" type="button" hidden>Practise again</button>
        <noscript>Enable JavaScript to practise.</noscript>
      </section>
    </main>
  </body>
</html>
